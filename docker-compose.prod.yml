version: '3.8'

services:
  browserpilot:
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    # Production logging
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    # Don't mount local .env in production
    volumes:
      - ./outputs:/app/outputs
    # Production environment variables
    environment:
      # AI Model Configuration - Choose one
      - AI_MODEL_TYPE=${AI_MODEL_TYPE:-gemini}  # Default to gemini, use 'ollama' for Ollama
      # For Google Gemini (when AI_MODEL_TYPE=gemini)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # For Ollama (when AI_MODEL_TYPE=ollama) - Connect to host Ollama server
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llava:latest}
      # Optional: Proxy configuration
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-[]}
      # Production settings
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=1
    # Add host.docker.internal for accessing host services (like Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"