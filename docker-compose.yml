version: '3.8'

services:
  browserpilot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # AI Model Configuration - Choose one
      - AI_MODEL_TYPE=${AI_MODEL_TYPE:-gemini}  # Default to gemini, use 'ollama' for Ollama
      # For Google Gemini (when AI_MODEL_TYPE=gemini)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # For Ollama (when AI_MODEL_TYPE=ollama) - Connect to host Ollama server
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llava:latest}
      # Optional: Proxy configuration
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-[]}
    volumes:
      # Persist outputs directory
      - ./outputs:/app/outputs
      # Optional: Mount .env file for local development
      - ./.env:/app/.env:ro
    restart: unless-stopped
    # Use SHM size to prevent browser crashes
    shm_size: '2gb'
    # Security options for running browsers
    security_opt:
      - seccomp:unconfined
    # Add host.docker.internal for accessing host services (like Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: browserpilot-network